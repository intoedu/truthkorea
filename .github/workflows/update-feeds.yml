# 트루스데일리 새 기사와 트루스코리아 유튜브 새 영상을 매시간 받아 data/truthdaily.json 에 저장합니다.
# GitHub의 예약 실행(schedule)은 붐빌 때 몇 시간씩 밀리거나 건너뛰어지므로,
# 한 번 시작하면 약 5시간 50분 동안 머물면서 매시간 직접 받아 옵니다(공개 저장소라 Actions 사용료 없음).
# 다음 예약 실행은 앞 실행이 끝날 때까지 기다렸다가 이어서 시작하므로(concurrency) 빈 시간이 생기지 않습니다.
# 바뀐 것이 있을 때만 main에 커밋하고, 홈페이지(GitHub Pages)를 다시 만들도록 요청합니다.
# Actions 탭에서 ‘Run workflow’를 누르면 바로 시작합니다.
name: 트루스데일리 소식 자동 업데이트

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 매시간 기사와 영상 받기 (약 5시간 50분 동안)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          end=$(( $(date +%s) + 350*60 ))
          while :; do
            # 그사이 main에 올라온 변경을 먼저 받아 둡니다(사이트 수정과 겹치지 않게)
            git pull --rebase --quiet origin "${GITHUB_REF_NAME}" || git rebase --abort || true
            node scripts/update-feeds.mjs || echo "이번 회차는 건너뜁니다."
            if ! git diff --quiet -- data/truthdaily.json; then
              git add data/truthdaily.json
              git commit -m "트루스데일리 소식 자동 업데이트" --quiet
              pushed=0
              for try in 1 2 3; do
                if git push --quiet origin "HEAD:${GITHUB_REF_NAME}"; then pushed=1; break; fi
                git pull --rebase --quiet origin "${GITHUB_REF_NAME}" || git rebase --abort || true
              done
              if [ "$pushed" = 1 ]; then
                gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null 2>&1 || true
                echo "$(date -u +%FT%TZ) 새 소식 올림"
              else
                echo "$(date -u +%FT%TZ) 올리기 실패, 다음 회차에 다시 합니다."
                git reset --quiet --hard "origin/${GITHUB_REF_NAME}"
              fi
            else
              echo "$(date -u +%FT%TZ) 바뀐 것이 없습니다."
            fi
            now=$(date +%s)
            [ $(( now + 3600 )) -gt "$end" ] && break
            sleep $(( 3600 - now % 3600 + 60 ))   # 다음 정시 1분 뒤에 다시 받기
          done
