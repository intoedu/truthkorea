# 트루스데일리 새 기사와 트루스데일리TV 새 영상을 한 시간마다 받아 data/truthdaily.json 에 저장합니다.
# 바뀐 것이 있을 때만 main에 커밋하고, 홈페이지(GitHub Pages)를 다시 만들도록 요청합니다.
# Actions 탭에서 ‘Run workflow’를 누르면 바로 한 번 실행됩니다.
name: 트루스데일리 소식 자동 업데이트

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 기사와 영상 받기
        run: node scripts/update-feeds.mjs
      - name: 바뀐 것이 있으면 커밋
        id: commit
        run: |
          if git diff --quiet -- data/truthdaily.json; then
            echo "바뀐 것이 없습니다."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/truthdaily.json
          git commit -m "트루스데일리 소식 자동 업데이트"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=1" >> "$GITHUB_OUTPUT"
      - name: 홈페이지 다시 만들기 요청
        if: steps.commit.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || echo "다시 만들기 요청은 건너뜁니다(커밋만으로도 보통 다시 만들어집니다)."
